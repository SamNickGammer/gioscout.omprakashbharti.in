<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoScout — Options</title>
    <style>
      :root {
        --bg: #0e1116; --surface: #161a21; --border: #232a35;
        --text: #e3e7ee; --muted: #8b93a3; --gold: #e0b53d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 40px 20px;
        font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(900px 300px at 50% -10%, rgba(224,181,61,0.08), transparent), var(--bg);
        color: var(--text);
        display: flex; justify-content: center;
      }
      .card {
        width: 100%; max-width: 440px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; padding: 28px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
      label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 16px 0 6px; }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--border); background: #0f131a; color: var(--text); font-size: 14px;
      }
      .actions { display: flex; gap: 10px; margin-top: 24px; }
      button { border: none; border-radius: 9px; padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
      .save { color: #1c1607; background: linear-gradient(135deg, #f0d27a, var(--gold)); flex: 1; }
      .test { background: #232a35; color: var(--text); }
      .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
      .ok { color: #4ade80; }
      .err { color: #fb7185; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>GeoScout connection</h1>
      <p class="sub">Just two things — everything else lives in the popup.</p>

      <label for="apiBaseUrl">API base URL</label>
      <input id="apiBaseUrl" type="text" placeholder="http://localhost:3000" />

      <label for="apiKey">Your personal API key</label>
      <input id="apiKey" type="password" placeholder="gsk_…" />

      <div class="actions">
        <button class="save" id="save">Save</button>
        <button class="test" id="test">Test connection</button>
      </div>
      <div class="status" id="status"></div>

      <p class="hint">
        Get your key from the dashboard → <strong>Settings</strong>. Search, area selection,
        radius and filters are all in the toolbar popup.
      </p>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
